# Build and test on every pull request, and on every push to the main branch.
#
# The "easybuild-shipit.yml" workflow waits for this one to succeed before preparing a release,
# so if you rename this workflow, remember to update the "workflows" filter over there as well.
name: test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    # A cold run takes well under 5 minutes; fail a hung Fable/MSBuild instead of waiting for the 6h default
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      # Also runs `dotnet tool restore`, through the "install" script in package.json
      - name: Install
        run: npm ci
      # Builds the sample as well as the packages
      - name: Build
        run: dotnet build Fable.Lit.sln
      # Lit.Server's tests. Runs before npm test: it writes test/server-rendered.json,
      # which the browser-side differential test compares lit's output against
      - name: Test Lit.Server
        run: dotnet test test/Lit.Server.Tests/Lit.Server.Tests.fsproj
      # Compiles the tests with Fable and runs them in headless Chrome
      - name: Test
        run: npm test
