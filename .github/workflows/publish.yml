name: Publish
# Builds the docs site and deploys it to GitHub Pages (the gh-pages branch).
on:
  push:
    branches:
      - main
    paths:
      - "docsrc/**"
      - "nacara.config.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      # `npm install` runs `dotnet tool restore`, which needs the SDK from global.json
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      # The docs toolchain (nacara 1.0.0-beta) needs Node 14: newer versions throw when it cleans
      # up folders that don't exist yet, because of a change to fs.rmdir in Node 16
      - uses: actions/setup-node@v6
        with:
          node-version: 14.17.*
      - name: Install and use custom node version
        run: npm i -g npm@7
      - name: Restore dependencies
        run: npm install
      - name: Build site
        run: npm run docs
      - name: Deploy site
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/docs
